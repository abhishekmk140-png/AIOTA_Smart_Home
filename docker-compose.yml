services:
  postgres:
    image: postgres:16
    container_name: aiota-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: aiota
      POSTGRES_PASSWORD: aiota_dev_password
      POSTGRES_DB: aiota
    ports:
      - "5432:5432"
    volumes:
      - aiota_pgdata:/var/lib/postgresql/data

  mosquitto:
    image: eclipse-mosquitto:2
    container_name: aiota-mqtt
    restart: unless-stopped
    ports:
      - "1883:1883"
    volumes:
      - ./mosquitto.conf:/mosquitto/config/mosquitto.conf:ro

volumes:
  aiota_pgdata:
